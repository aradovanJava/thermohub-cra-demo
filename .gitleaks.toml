# Secret scanning – CRA Annex I Part I (2)(e): secrets never ship inside the product.
title = "ThermoHub gitleaks configuration"

[extend]
useDefault = true

# Spring Boot properties files: any password/secret/token/key with a literal value.
[[rules]]
id = "spring-properties-secret"
description = "Literal secret in a Spring properties file – inject it from the environment or a secret store"
regex = '''(?im)^[ \t]*[a-z0-9._-]*(password|passwd|secret|token|api[-_.]?key|private[-_.]?key)[ \t]*[=:][ \t]*([^\s#$][^\s#]{7,})'''
secretGroup = 2
path = '''\.properties$'''
keywords = ["password", "passwd", "secret", "token", "key"]

# Documented exception: public demo passphrases for the local talk demo (see README, "Demo credentials").
[[allowlists]]
description = "Demo-only credentials, public by design"
paths = [
  '''application-demo\.properties$''',
  '''http/http-client\.env\.json$''',
]
