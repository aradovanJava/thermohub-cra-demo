spring.application.name=thermohub-cra
server.port=8081

# ---------------------------------------------------------------------------
# A02 / CRA Annex I Part I (2)(b),(j) – secure by default, minimal attack surface
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.env.show-values=never
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------------------------
# A09 / CRA Annex I Part I (2)(l) – structured, machine-readable security logging
# ECS JSON escapes CR/LF, so a forged line break stays inside its field.
# ---------------------------------------------------------------------------
logging.structured.format.console=ecs

# ---------------------------------------------------------------------------
# A04 / A07 – no secrets and no default credentials in the repository.
# Provide them from the environment or a secret store at installation time:
#   THERMOHUB_ADMIN_PASSWORD        administrator passphrase (>= 15 chars, see PasswordPolicy)
#   THERMOHUB_CRYPTO_WIFI_KEY       Base64, 256-bit data key for Wi-Fi credentials
#   THERMOHUB_FIRMWARE_PUBLIC_KEY   Base64 Ed25519 public key of the release pipeline
# Without them the product refuses to start (fail closed).
# ---------------------------------------------------------------------------
thermohub.demo.enabled=false
