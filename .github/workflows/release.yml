# Release = signed, attested, documented. CRA Annex I Part II (7) secure distribution of updates,
# Part II (1) SBOM, Annex VII technical documentation. Triggered by a version tag (v2.5.0).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # keyless signing (Sigstore) for attestations
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Full CRA gate on the release candidate
        run: mvn -B -pl thermohub-cra -am verify -Pcra-gate

      - name: Build provenance attestation (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: thermohub-cra/target/thermohub-cra-*.jar

      - name: SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-path: thermohub-cra/target/thermohub-cra-*.jar
          sbom-path: thermohub-cra/target/bom.json

      - name: Publish release with SBOM and conformance report
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            thermohub-cra/target/thermohub-cra-*.jar
            thermohub-cra/target/bom.json
            thermohub-cra/target/cra-conformance-report-*.md
