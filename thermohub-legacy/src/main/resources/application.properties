spring.application.name=thermohub-legacy
server.port=8080

# ---------------------------------------------------------------------------
# A02:2025 Security Misconfiguration – "it is only reachable from our network"
# Every actuator endpoint, unauthenticated, with unmasked values (/actuator/env, /actuator/heapdump ...)
